paths:
  /api/patients/profile:
    post:
      summary: Create patient profile
      description: Creates a patient profile for the authenticated patient.
      tags:
        - Patient

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gender
                - dateOfBirth
                - phoneNumber
                - address
                - bloodGroup
                - genotype
                - emergencyContact

              properties:
                gender:
                  type: string
                  enum:
                    - Male
                    - Female
                  example: Female

                dateOfBirth:
                  type: string
                  format: date
                  example: "2004-08-10"

                phoneNumber:
                  type: string
                  example: "08012345678"

                address:
                  type: string
                  example: Lagos, Nigeria

                allergies:
                  type: array
                  items:
                    type: string
                  example:
                    - Penicillin

                medicalHistory:
                  type: array
                  items:
                    type: string
                  example:
                    - Asthma

                bloodGroup:
                  type: string
                  enum:
                    - A+
                    - A-
                    - B+
                    - B-
                    - AB+
                    - AB-
                    - O+
                    - O-
                  example: O+

                genotype:
                  type: string
                  enum:
                    - AA
                    - AS
                    - SS
                    - AC
                    - SC
                  example: AA

                emergencyContact:
                  type: string
                  example: "08098765432"

                profilePicture:
                  type: string
                  example: "https://example.com/profile.jpg"

      responses:
        "201":
          description: Patient profile created successfully.

        "400":
          description: Invalid request.

        "401":
          description: Unauthorized.

        "500":
          description: Failed to create patient's profile.
  


    get:
      summary: Get patient profile
      description: Retrieves the authenticated patient's profile.
      tags:
        - Patient

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Patient profile retrieved successfully.

        "401":
          description: Unauthorized.

        "404":
          description: Patient profile not found.

        "500":
          description: Failed to retrieve patient's profile.


    patch:
      summary: Update patient profile
      description: Updates the authenticated patient's profile.
      tags:
        - Patient

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                address:
                  type: string
                allergies:
                  type: array
                  items:
                    type: string
                medicalHistory:
                  type: array
                  items:
                    type: string
                emergencyContact:
                  type: string
                profilePicture:
                  type: string

      responses:
        "200":
          description: Patient profile updated successfully.

        "401":
          description: Unauthorized.

        "404":
          description: Patient profile not found.

        "500":
          description: Failed to update patient's profile.