paths:
  /api/appointments:
    post:
      summary: Book Appointment
      description: |
        Allows an authenticated patient to book an appointment with a doctor.

        Business Rules:
        - Patient profile must exist.
        - Doctor profile must exist.
        - Appointment cannot be booked in the past.
        - Doctor must be available on the selected day.
        - Appointment time must fall within the doctor's working hours.
        - Double booking is not allowed.
        - A confirmation email is automatically sent after a successful booking.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - doctorId
                - appointmentDate
                - reason

              properties:
                doctorId:
                  type: string
                  example: "68a6038298eebcb9055ea1ac9"

                appointmentDate:
                  type: string
                  format: date-time
                  example: "2026-09-11T11:00:00.000Z"

                reason:
                  type: string
                  example: Chest pain and difficulty breathing.

      responses:
        "201":
          description: Appointment booked successfully.

        "400":
          description: |
            Booking failed because one of the following occurred:
              - Appointment is in the past.
              - Doctor is unavailable.
              - Appointment time is outside working hours.
              - Doctor already has another appointment.

        "401":
          description: Authentication required.

        "404":
          description: Patient profile or doctor profile not found.

        "500":
          description: Failed to book appointment.

  /api/appointments/my:
    get:
      summary: View My Appointments
      description: Returns every appointment belonging to the authenticated patient.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Appointments retrieved successfully.

        "401":
          description: Authentication required.

        "404":
          description: Patient profile not found.

        "500":
          description: Failed to retrieve patient's appointment.

  /api/appointments/doctor:
    get:
      summary: View Doctor Appointments
      description: Returns every appointment assigned to the authenticated doctor.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Doctor appointments retrieved successfully.

        "401":
          description: Authentication required.

        "404":
          description: Doctor profile not found.

      "500":
          description: Failed to retrieve doctor's appointment.

  /api/appointments/{id}/status:
    patch:
      summary: Update Appointment Status
      description: |
        Allows the assigned doctor to update an appointment.

        Business Rules:
        - Only the assigned doctor can update the appointment.
        - Status cannot be updated to the current status.
        - Accepted appointments cannot be modified.
        - Rejected appointments cannot be modified.
        - Cancelled appointments cannot be modified.
        - Completed appointments cannot be modified.
        - Approval email is automatically sent when status becomes "accepted".
        - Rejection email is automatically sent when status becomes "rejected".

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: string

          example: "68b2c9ab55a9d45d1b73ab29"

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - status

              properties:
                status:
                  type: string

                  enum:
                    - accepted
                    - rejected
                    - completed

      responses:
        "200":
          description: Appointment status updated successfully.

        "400":
          description: |
            Status update failed because:
              - Appointment already has this status.
              - Accepted appointment cannot be modified.
              - Rejected appointment cannot be modified.
              - Cancelled appointment cannot be modified.
              - Completed appointment cannot be modified.

        "401":
          description: Authentication required.

        "403":
          description: You are not authorized to update this appointment.

        "404":
          description: Appointment or doctor profile not found.

        "500":
          description: Failed to update appointment. 

  /api/appointments/{id}/cancel:
    patch:
      summary: Cancel Appointment

      description: |
        Allows a patient to cancel their appointment.

        Business Rules:
        - Patient must own the appointment.
        - Completed appointments cannot be cancelled.
        - Already cancelled appointments cannot be cancelled again.
        - Cancellation email is automatically sent.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: string

      responses:
        "200":
          description: Appointment cancelled successfully.

        "400":
          description: |
            Cancellation failed because:
              - Appointment is already cancelled.
              - Appointment has been completed.

        "401":
          description: Authentication required.

        "403":
          description: You are not authorized to cancel this appointment.

        "404":
          description: Appointment or patient profile not found.

        "500":
          description: Failed to cancel patient's appointment.

  /api/appointments/{id}/reschedule:
    patch:
      summary: Reschedule Appointment

      description: |
        Allows the patient to reschedule an appointment.

        Business Rules:
        - Patient must own the appointment.
        - Cannot reschedule completed appointments.
        - Cannot reschedule cancelled appointments.
        - New date cannot be in the past.
        - Doctor must be available.
        - Appointment must be within working hours.
        - Double booking is prevented.
        - Status automatically returns to "pending".

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - appointmentDate

              properties:
                appointmentDate:
                  type: string
                  format: date-time
                  example: "2026-09-20T14:00:00.000Z"

      responses:
        "200":
          description: Appointment rescheduled successfully.

        "400":
          description: |
            Rescheduling failed because:
              - Appointment is completed.
              - Appointment is cancelled.
              - Date is in the past.
              - Doctor is unavailable.
              - Appointment is outside working hours.
              - Doctor is already booked.

        "401":
          description: Authentication required.

        "403":
          description: You are not authorized to reschedule this appointment.

        "404":
          description: Appointment or patient profile not found.

        "500":
          description: Failed to reschedule appointment.

  /api/appointments/status/{status}:
    get:
      summary: Filter appointments by status
      description: Returns appointments filtered by their status for the authenticated patient or doctor.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: status
          required: true

          schema:
            type: string
            enum:
              - pending
              - accepted
              - rejected
              - cancelled
              - completed

      responses:
        "200":
          description: Filtered appointments retrieved successfully.

        "401":
          description: Authentication required.

        "404":
          description: Patient or doctor profile not found.

        "500":
          description: Failed to retrieve appointment's status.

  /api/appointments/date/{date}:
    get:
      summary: Filter appointments by date
      description: Returns appointments for a specific appointment date.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: date
          required: true

          schema:
            type: string
            format: date-time

          example: "2026-09-11T11:00:00.000Z"

      responses:
        "200":
          description: Filtered appointments retrieved successfully.

        "401":
          description: Authentication required.

        "404":
          description: Patient or doctor profile not found.

        "500":
          description: Failed to retrieve appointment by date.

  /api/appointments/doctor/{doctorId}:
    get:
      summary: Filter appointments by doctor
      description: Returns every appointment belonging to the specified doctor.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: doctorId
          required: true

          schema:
            type: string

      responses:
        "200":
          description: Doctor appointments retrieved successfully.

        "404":
          description: Doctor not found.

        "500":
          description: Failed to retrieve doctor's appointments.

  /api/appointments/patient/{patientId}:
    get:
      summary: Filter appointments by patient
      description: Returns every appointment belonging to the specified patient.

      tags:
        - Appointment

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: patientId
          required: true

          schema:
            type: string

      responses:
        "200":
          description: Patient appointments retrieved successfully.

        "404":
          description: Patient not found.
        
        "500":
          description: Failed to retrieve patient's appointments.